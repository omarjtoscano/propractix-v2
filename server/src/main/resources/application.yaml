debug: false

spring:
  application:
    name: propractix-backend
  flyway:
    locations: classpath:db/migration
    out-of-order: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health

logging:
  structured:
    format:
      console: ecs
    json:
      add:
        environment: ${propractix.runtime.environment}
        release_sha: ${propractix.runtime.release-sha}

propractix:
  runtime:
    environment: ${PROPRACTIX_ENVIRONMENT:local}
    release-sha: ${PROPRACTIX_RELEASE_SHA:development}
  catalog:
    enabled-countries:
      - ES
    supported-locales:
      - es
      - en
    country-default-locales:
      ES: es
    fallback-locale: es
