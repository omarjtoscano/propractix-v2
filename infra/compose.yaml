services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: propractix
      POSTGRES_PASSWORD_FILE: /run/secrets/database.password
      POSTGRES_USER: propractix
    secrets:
      - database.password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propractix -d propractix"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - propractix_postgres_data:/var/lib/postgresql/data
    networks:
      - local

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - local

secrets:
  database.password:
    file: ${PROPRACTIX_DB_PASSWORD_FILE:-./local/secrets/database.password}

networks:
  local:

volumes:
  propractix_postgres_data:
