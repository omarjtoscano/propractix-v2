name: propractix-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROPRACTIX_DB_NAME:-propractix}
      POSTGRES_USER: ${PROPRACTIX_DB_USER:-propractix}
      POSTGRES_PASSWORD_FILE: /run/secrets/database.password
    secrets:
      - database.password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    mem_limit: 640m
    cpus: 0.75
    logging: *default-logging

  migrate:
    image: ${PROPRACTIX_SERVER_IMAGE:?set a server image pinned by digest}
    profiles: ["migration"]
    environment: &server-environment
      SPRING_PROFILES_ACTIVE: staging
      PROPRACTIX_DB_URL: jdbc:postgresql://postgres:5432/${PROPRACTIX_DB_NAME:-propractix}
      PROPRACTIX_DB_USER: ${PROPRACTIX_DB_USER:-propractix}
      PROPRACTIX_RELEASE_SHA: ${PROPRACTIX_RELEASE_SHA:?set the full release SHA}
    secrets:
      - database.password
    command: ["--spring.main.web-application-type=none"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    mem_limit: 512m
    cpus: 0.75
    logging: *default-logging

  server:
    image: ${PROPRACTIX_SERVER_IMAGE:?set a server image pinned by digest}
    restart: unless-stopped
    environment:
      <<: *server-environment
      SPRING_FLYWAY_ENABLED: "false"
    secrets:
      - database.password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - private
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging

  client:
    image: ${PROPRACTIX_CLIENT_IMAGE:?set a client image pinned by digest}
    restart: unless-stopped
    environment:
      PROPRACTIX_SITE_ADDRESS: ${PROPRACTIX_SITE_ADDRESS:?set an approved HTTPS site address}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
      - public
    mem_limit: 192m
    cpus: 0.5
    logging: *default-logging

secrets:
  database.password:
    file: ${PROPRACTIX_DB_PASSWORD_FILE:?set the external database password file}

networks:
  public:
  private:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
