apiVersion: propractix.io/v1
kind: PublicEndpointRateLimitPolicy
metadata:
  policyId: public-endpoint-rate-limits
  version: 1
  status: CLOSED
  preparedAt: 2026-09-21
  approvedAt: 2026-09-27
  approvedCommit: fec3b2ed3a5afa04d1c079bda4f2d8981efd5920
  approvedBy: PRODUCT_OWNER
  owners:
    - SECURITY
    - OPERATIONS
spec:
  activation:
    requireApprovedStatus: true
    missingOperationBehavior: DENY_NOT_CONFIGURED
    unlistedEndpointsAuthorized: false
  enforcement:
    availabilityMode: FAIL_CLOSED
    limitedResponse:
      status: 429
      contentType: application/problem+json
      code: rate_limited
      retryAfter: SECONDS_UNTIL_ALL_VIOLATED_WINDOWS_RESET
    unavailableResponse:
      status: 503
      contentType: application/problem+json
      code: rate_limiter_unavailable
      retryAfterSeconds: 1
  subject:
    type: CLIENT_IP_HMAC
    privacy:
      classification: PSEUDONYMIZED_IDENTIFIER
      anonymousData: false
      purpose: ABUSE_PREVENTION_ONLY
      reuseForOtherPurposes: PROHIBITED
      productionPublicExposurePrivacyReviewRequired: true
      localH02AcceptanceBlockedByPrivacyReview: false
    hmac:
      algorithm: HMAC-SHA-256
      purpose: RATE_LIMIT_CLIENT_IP
      domainSeparator: "propractix:ratelimit-ip:v1\n"
      encoding: BASE64URL_NO_PADDING
      writeVersion: rl-ip-v1
      readVersions:
        - rl-ip-v1
      materialSource: EXTERNAL_SECRET
    normalization:
      ipv4PrefixLength: 32
      ipv6PrefixLength: 64
      ipv4MappedIpv6: NORMALIZE_AS_IPV4
      zoneIdentifier: REMOVE_BEFORE_CANONICALIZATION
      ambiguousAddressSyntax: REJECT
  clientIpResolution:
    deploymentModes:
      directLocal:
        mode: REMOTE_ADDRESS
        forwardingHeaders: IGNORE
      behindCaddy:
        modeFromTypedEnvironmentConfiguration: true
        exactlyOneAllowedModeRequired: true
        allowedModes:
          - FORWARDED
          - X_FORWARDED_FOR
        simultaneousForwardingHeaders: REJECT_CONFIGURATION
        trustRequires:
          - IMMEDIATE_PEER_IN_CONFIGURED_TRUSTED_PROXY_CIDR
          - CADDY_SANITIZATION_CONFIGURED_AND_TESTED
        clientSuppliedForwardingHeadersAtEdge: REMOVE_FORWARDED_AND_X_FORWARDED_FOR
        selectedHeader: REBUILD_FROM_OBSERVED_NETWORK_HOP
        unselectedHeader: REMOVE
    forwardedHeadersTrustedOnlyFromConfiguredProxyCidrs: true
    trustedProxyCidrAloneIsSufficient: false
    untrustedPeerForwardingHeaders: IGNORE
    trustedProxyChainTraversal: RIGHT_TO_LEFT_FIRST_UNTRUSTED
    trustedIntermediaryBehavior: APPEND_DIRECTLY_OBSERVED_PEER
    missingOrMalformedTrustedProxyChain: FAIL_CLOSED
    forbiddenTrustedProxyCidrs:
      - 0.0.0.0/0
      - ::/0
  storage:
    owner: platform.ratelimit
    adapter: POSTGRESQL_16
    table: platform_rate_limit_bucket
    atomicAcrossRulesAndActiveHmacVersions: true
    expiredRowsAffectDecisions: false
    cleanup:
      mode: IDEMPOTENT_BATCH
      interval: PT1M
      logicalExpiration:
        burst: PT70S
        sustained: PT120S
      physicalDeletion: NEXT_NORMAL_CLEANUP_CYCLE
      expiredRowsIncidentThresholds:
        rowCountGreaterThan: 10000
        oldestExpiredAgeGreaterThan: PT15M
        action: ALERT_AND_OPEN_INCIDENT
  observability:
    metrics:
      allowed:
        name: propractix_rate_limit_allowed_total
        allowedLabels:
          - operation_id
          - policy_version
      rejected:
        name: propractix_rate_limit_rejected_total
        allowedLabels:
          - operation_id
          - policy_version
          - rule_id
      adapterErrors:
        name: propractix_rate_limit_adapter_errors_total
        allowedLabels:
          - operation_id
          - policy_version
          - error_class
    forbiddenLabels:
      - ip
      - ip_fingerprint
      - hmac_key_version
      - query
      - cursor
      - user_agent
      - correlation_id
  operations:
    - operationId: searchAcademicInstitutions
      method: GET
      pathTemplate: /api/v1/academic-institutions
      contractVersion: v1
      queryParametersDoNotCreateNewSubjects:
        - query
        - cursor
        - limit
      rules:
        - ruleId: burst
          algorithm: FIXED_WINDOW
          limit: 15
          window: PT10S
          counterTtl: PT70S
        - ruleId: sustained
          algorithm: FIXED_WINDOW
          limit: 60
          window: PT60S
          counterTtl: PT120S
