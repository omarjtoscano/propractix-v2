name: Build OCI release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build server OCI archive
        id: server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          tags: propractix-server:${{ github.sha }}
          outputs: type=oci,dest=/tmp/propractix-server.oci.tar
          provenance: true
          sbom: true
      - name: Build client OCI archive
        id: client
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: propractix-client:${{ github.sha }}
          outputs: type=oci,dest=/tmp/propractix-client.oci.tar
          provenance: true
          sbom: true
      - name: Create immutable release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          CLIENT_DIGEST: ${{ steps.client.outputs.digest }}
        run: |
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg serverImage "propractix-server@$SERVER_DIGEST" \
            --arg clientImage "propractix-client@$CLIENT_DIGEST" \
            '{sourceSha: $sourceSha, serverImage: $serverImage, clientImage: $clientImage}' \
            > /tmp/release-manifest.json
      - name: Upload OCI archives and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: propractix-${{ github.sha }}-oci
          path: |
            /tmp/propractix-server.oci.tar
            /tmp/propractix-client.oci.tar
            /tmp/release-manifest.json
          retention-days: 7
