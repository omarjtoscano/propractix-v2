name: Build OCI release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "docs/policies/public-endpoint-rate-limits-v1.yaml"
      - ".dockerignore"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/oci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server OCI archive
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: propractix-server:${{ github.sha }}
          outputs: type=oci,dest=/tmp/propractix-server.oci.tar
          provenance: true
          sbom: true
      - name: Build client OCI archive
        id: client
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: propractix-client:${{ github.sha }}
          outputs: type=oci,dest=/tmp/propractix-client.oci.tar
          provenance: true
          sbom: true
      - name: Create immutable release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          CLIENT_DIGEST: ${{ steps.client.outputs.digest }}
        run: |
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg serverImage "propractix-server@$SERVER_DIGEST" \
            --arg clientImage "propractix-client@$CLIENT_DIGEST" \
            '{sourceSha: $sourceSha, serverImage: $serverImage, clientImage: $clientImage}' \
            > /tmp/release-manifest.json
      - name: Upload OCI archives and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: propractix-${{ github.sha }}-oci
          path: |
            /tmp/propractix-server.oci.tar
            /tmp/propractix-client.oci.tar
            /tmp/release-manifest.json
          retention-days: 7
